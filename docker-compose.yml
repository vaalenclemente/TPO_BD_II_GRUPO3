# levanta los cuatro motores de db
# comando: docker compose up -d

services:

  # ---------- mysql----------
  mysql:
    image: mysql:8.4
    container_name: logistica-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: logistica      # se crea automaticamente
      MYSQL_USER: logistica
      MYSQL_PASSWORD: logistica
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- mongodb----------
  mongo:
    image: mongo:7
    container_name: logistica-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- neo4j----------
  neo4j:
    image: neo4j:5
    container_name: logistica-neo4j
    environment:
      NEO4J_AUTH: neo4j/logistica123   # usuario/contraseña (minimo 8 caracteres)
    ports:
      - "7474:7474"   # navegador web para inspeccionar
      - "7687:7687"   # protocolo bolt (el que usa java)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p logistica123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ---------- redis----------
  redis:
    image: redis:7
    container_name: logistica-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

# volumenes: los datos sobreviven aunque se detengan los contenedores.
# redis no tiene volumen a proposito: no es fuente de verdad, se reconstruye.
volumes:
  mysql_data:
  mongo_data:
  neo4j_data: